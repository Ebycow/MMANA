# cargo-mutants (docs/guarantees.md, 検証コードのテスト). Mutants listed here
# change nothing a test could see; each says why.
exclude_re = [
    # the bits or'ed together never overlap (15-bit fields, a sign bit; F/B
    # ranges are validated to at most 360 and 180)
    'replace \| with \^ in Segmentation::to_code$',
    'replace \| with \^ in Environment::fbr_code$',
    # a maximum or bound replaced by an equal value
    'replace < with <= in PatternState::horizontal_maxima$',
    'replace > with >= in CurState::set_cur_dir$',
    'elements\.rs:\d+:34: replace [<>] with [<>]= in Group::ana_type$',
    # a polar wire is compared to 1e-9 of its length and of 360°: rounding
    # stays far below either, and a value that cannot be set (an azimuth
    # turned round, a length below 0) misses by far more
    "optimize\\.rs:\\d+:79: replace \\* with / in Search<'_, F>::breaks$",
    # exactly at a threshold, where it makes no difference or no wire lands:
    # a field of exactly 1e-30 (its dB value is kept only above it), a section
    # exactly as long as what is left of the wire (cut to it either way), a
    # section's segments exactly 1/DM2DEF of the longest allowed
    'farfield\.rs:\d+:15: replace > with >= in Mininec::far_field_at$',
    'segment\.rs:\d+:34: replace > with >= in comb_wire$',
    'segment\.rs:\d+:60: replace > with >= in comb_wire$',
    # a stack of 1 copies the wires once, moved by 0
    'replace > with >= in AntDef::stack$',
    # rows per parallel block: the elements are the same however many
    'replace / with [*%] in Mininec::fill_rows$',
    # the sign of 0 sets the phase of a field of 0, which nothing reads
    'replace [<>] with [<>]= in sgn_f$',
    # the sign of an imaginary part of 0 (the root of a lossless medium's
    # constant) only signs zeros that are added to other terms
    'farfield\.rs:\d+:77: replace < with <= in csqrt$',
    # turning the sign of every term of an s-domain load turns its numerator
    # and denominator alike
    'matrix\.rs:\d+:29: delete - in Mininec::add_loads$',
    # R = 0 gives an infinite Q, which the check after it refuses as well
    'resonance\.rs:\d+:35: replace > with >= in series_circuit$',
    # S87's shortcut for the self term only answers early what L135's exact
    # kernel answers too; these make the midpoint an integer or -1/2, which
    # the half-integer observation point never is, so it only falls through
    'kernel\.rs:\d+:(58|64): replace [+/] with [-*%] in Mininec::s87$',
    # likewise S102's for half a segment: a radius exactly SRM never occurs,
    # and below it L135 gives the same
    'kernel\.rs:\d+:33: replace < with (==|<=) in Mininec::s102$',
    # a free end is marked -i only to be unlike every junction: marked +i it
    # matches only the junction at wire i's other end, whose wires share
    # that junction with wire i already
    'geometry\.rs:\d+:(26|31): delete - in Mininec::connect$',
    # SNO and SMAX are read only as their difference, on one wire
    'geometry\.rs:\d+:37: replace - with [+/] in Mininec::number_pulses$',
    # pulses come wire by wire: a pulse starts on the last wire only when the
    # pulse is on it, and L1270 then goes on to L1279 too
    'geometry\.rs:\d+:31: replace > with >= in Mininec::number_pulses$',
    # an apex that is level with the other corner: the corners of a loop
    # with three corners are never level, nor on one line
    'elements\.rs:\d+:19: replace > with >= in Group::ana_type$',
    # a bound of 0 is taken by the arms before
    'replace [<>] with [<>]= in Group::new_bounds$',
    # from the base element on, the base's own interval is 0 either way
    'elements\.rs:\d+:28: replace \+ with \* in ElementList::sort$',
    # no wire has a radius of 0 (set_wz leaves them out)
    'circuit\.rs:\d+:13: replace < with <= in wire_loss$',
    'segment\.rs:\d+:21: replace < with <= in AntDef::set_wz$',
    # the end of a wire on the ground shows the current of its own pulse
    # there whichever way it is taken, with the same sign
    'currents\.rs:\d+:23: replace != with == in Mininec::current_distribution$',
    # a pulse end with no length adds 0 to the field
    'farfield\.rs:\d+:43: replace < with <= in Mininec::far_field_at$',
    # at the last pulse, going round once more for the last wire sets what
    # was just set
    'geometry\.rs:\d+:100: replace < with (<=|>) in Mininec::number_pulses$',
    # the arrays have room for 2 more points per wire than any wire uses;
    # with at least one segment per wire, 2 x wires x segments is never
    # fewer than segments + 2 x wires
    'geometry\.rs:\d+:(73|82): replace \+ with \* in Mininec::build_wires$',
    # the ends of a wire with no pulse: nothing reads them, and the next
    # wire writes over where the mutant puts them
    'geometry\.rs:\d+:39: replace - with \+ in Mininec::build_wires$',
    # which slot of the PSI cache is reused sets only how often PSI is
    # computed again, not its value
    'replace <= with > in PsiCache::s87$',
    # S28 integrates an image from its other end: the two points of each
    # pair swap, whose sum is the same, and the exact kernel's half-interval
    # is taken only about a segment's own midpoint, whose halves mirror
    'kernel\.rs:\d+:33: replace < with (==|>|<=) in Mininec::s28$',
    # a ratio exactly 1e-9 past 1.1, 6 or 10, which no geometry lands on
    'kernel\.rs:\d+:(16|18): replace > with >= in Mininec::l135$',
    # a copy is recomputed only when it is exactly 0, which no element of
    # the k = +1 term is
    'matrix\.rs:\d+:(34|38|46|50): replace [/%+] with [-+*/%] in Mininec::fill$',
    # a pulse whose second half is on a wire run backwards (an end on the
    # ground, or joined end to end with an earlier wire) is the last on its
    # wire, so the next pulse is never on that wire and the vertical-wire
    # test is not reached
    'matrix\.rs:\d+:(37|52): replace [+!]=? with [-*=]=? in Mininec::copy_sources$',
    # a pulse on the ground is half the wire and half its image, its own
    # image: skipping the antenna's term instead of the image's gives the same
    'nearfield\.rs:\d+:34: replace < with > in Mininec::magnetic_point$',
    # a real part exactly 0 with an imaginary part that is not
    'nearfield\.rs:\d+:21: replace > with >= in Mininec::electric_point$',
    # a section exactly λ/dm2 long
    'segment\.rs:\d+:45: replace > with >= in AntDef::tei_[be]$',
    'segment\.rs:\d+:(46|52|56): replace < with <= in comb_wire$',
    # the high nibble shifted left has no bits of the low one
    'replace \| with \^ in decode_note$',
    # dividing up to p/2 instead of √p finds the same primes
    'replace \* with \+ in nth_prime$',
    # at the minimum jX both ways give the minimum
    "optimize\\.rs:\\d+:15: replace < with <= in Search<'_, F>::score$",
    # the two roots of the capacitance match give shunt reactances of the
    # same size and opposite sign, and the score takes the size
    "optimize\\.rs:\\d+:38: replace \\+ with - in Search<'_, F>::score$",
    # the direction is ±1
    "optimize\\.rs:\\d+:38: replace \\* with / in Search<'_, F>::exec$",
    # a step already the largest allowed is set to the largest allowed
    "replace > with >= in Search<'_, F>::exec$",
    # one band: the sources and frequency are the antenna's already
    'optimize\.rs:\d+:25: replace > with >= in optimize$',
    # an equal value is the value
    'replace < with <= in PatternState::calc_fb$',
    # a reactance of exactly 0.1 Ω; or exactly 0, which is found before the
    # sign of a reactance is asked; or a fitted resonance exactly at one of
    # the two frequencies it was fitted to, where the reactance is not 0
    'replace < with <= in find_resonance$',
    # (nights 7 to 12)
    # probes a step below instead of above: as distinct, and never 0 or less
    'optimize\.rs:\d+:25: replace \+ with - in overlaps$',
    # differences of rounding are about 1e-16 of a value, those of order 1e-3
    # or more: 1e-9 of the larger or 1e-9 over it tells them apart alike
    'optimize\.rs:\d+:90: replace \* with / in overlaps$',
    # a gain or F/B exactly at its goal: the goal plus the log of 1
    "replace > with >= in Search<'_, F>::score$",
    # a trial that scores the same as the best so far: the search then turns
    # back from it instead of from the best, and the best is replaced only
    # by a higher score; a tie comes from a variable that changes nothing
    "optimize\\.rs:\\d+:30: replace < with <= in Search<'_, F>::exec$",
    # positions count no further than the last element, so one past it is
    # the last one's
    'optimize\.rs:\d+:42: replace - with [+/] in Editor::all_elements$',
    'elements\.rs:\d+:26: replace < with <= in ElementList::position$',
    # with no width and no height a loop has no perimeter either: a loop
    # with only one of them, the only case this changes, is no loop
    'optimize\.rs:\d+:64: replace \|\| with && in Editor::add_element$',
    # a bound replaced by an equal value
    'elements\.rs:\d+:38: replace [<>] with [<>]= in Group::ana_wire$',
    'geometry\.rs:\d+:\d+: replace < with <= in Mininec::set_ground$',
    # the base element is taken by the arm before
    'elements\.rs:\d+:21: replace < with <= in ElementList::set_position$',
    # L = 0 gives an infinite resonance, which the check after it refuses
    'resonance\.rs:\d+:23: replace > with >= in series_circuit$',
    # a stack of 1 is moved by 0 (or -0, which is added to coordinates)
    'replace > with >= in first_copy_offset$',
    # the zenith exactly as strong as a lobe in front, with less behind it:
    # no pattern has an exact tie there that is not one of a symmetric cut
    'pattern\.rs:\d+:37: replace > with >= in PatternState::get_vmax$',
    # exactly at a threshold: a direction 1e-12 below the horizon, a specular
    # point exactly on the boundary of the first medium
    'farfield\.rs:\d+:31: replace < with <= in Mininec::far_field_at$',
    'farfield\.rs:\d+:41: replace > with >= in Mininec::far_field_at$',
    # the length only scales how close to the ground an end counts as on it:
    # with an end that close, z2 + z1 and z2 - z1 differ by less than that
    'geometry\.rs:\d+:72: replace - with \+ in Mininec::build_wires$',
    # k is 1 for the antenna and -1 for its image: dividing by it is
    # multiplying by it, and it is never 0
    'farfield\.rs:\d+:84: replace \* with / in Mininec::far_field_at$',
    '(matrix|nearfield)\.rs:\d+:66: replace \* with / in Mininec::(compute_element|vector_terms)$',
    'nearfield\.rs:\d+:71: replace \* with / in Mininec::magnetic_point$',
    'nearfield\.rs:\d+:34: replace < with <= in Mininec::magnetic_point$',
    # at a real part of 0 both roots are the same
    'farfield\.rs:\d+:11: replace < with <= in csqrt$',
    # a wire's last pulse that goes on onto this wire: no model reaches it,
    # nor any of the 48 ways three wires can meet at their ends
    'currents\.rs:\d+:21: replace \+= with [-*]= in Mininec::s572$',
    # the first row is never a copy: skipping by its entries skips nothing,
    # and what a copy target computes the copy then replaces
    'matrix\.rs:\d+:32: replace \* with / in Mininec::fill$',
    # on the diagonal of a pulse of one radius and length the two halves are
    # mirror images, and the original takes the first for the second
    'matrix\.rs:\d+:15: replace < with <= in Mininec::compute_element$',
    # the first row of a panel has no rows above it in the panel
    'matrix\.rs:\d+:21: replace \+ with \* in factor$',
    # a wire end on the ground whose pulses already end where they start
    'currents\.rs:\d+:43: replace > with >= in Mininec::current_distribution$',
    # the horizontal cut at 2° holds two turns: an index twice as far round
    # is the same azimuth
    'pattern\.rs:\d+:44: replace / with \* in PatternState::calc_fb$',
    # the pulse at a junction with an earlier wire: the current the other
    # wire's end shows there; no model differs, nor any of the 48 ways three
    # wires can meet at their ends
    'currents\.rs:\d+:24: replace \+= with \*= in Mininec::current_distribution$',
    # a radius exactly SRM, which never occurs (as for S102 above)
    'kernel\.rs:\d+:22: replace > with >= in Mininec::l135$',
    # a segment exactly 4 times as long as the point is from it
    'kernel\.rs:\d+:16: replace < with <= in Mininec::note_shortcut$',
    # the arrays cut to the pulses' length kept longer: nothing reads past it
    'geometry\.rs:\d+:27: replace \+ with \* in Mininec::build_wires$',
    'resonance\.rs:\d+:(26|27): replace > with >= in find_resonance$',
]
