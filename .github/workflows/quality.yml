name: Quality

# The long versions of the quality checks (docs/guarantees.md): many more
# random models, and mutation testing of the input checks. Too slow for
# every push.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  random-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mmana-core --release --test random_models
        env:
          PROPTEST_CASES: 20000
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # one job at a time: a mutant that breaks a limit runs the inputs in
      # allocation.rs, which the test allocator stops at 256 MB
      - run: >
          cargo mutants -p mmana-core -j 1 --timeout 120
          -f crates/mmana-core/src/validate.rs -f crates/mmana-core/src/engine/pulse.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out
          path: mutants.out
