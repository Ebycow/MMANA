name: Quality

# The long versions of the quality checks (docs/guarantees.md): many more
# random models, element edits and optimisations, wire commands of the front
# end, and mutation testing of all of mmana-core, a fourteenth of it each
# night. Too slow for every push.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      night:
        description: Which fourteenth of the mutants to run (0 to 13); empty for tonight's
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  random-models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      # models, element edits (about 2 minutes) and optimisations (about 8)
      - run: cargo test -p mmana-core --release --test random_models --test random_edits --test random_optimize
        env:
          PROPTEST_CASES: 20000
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true

  random-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      # about 2 minutes
      - run: npx vitest run src/__tests__/randomCommands.test.ts
        env:
          FC_RUNS: 20000

  mutants:
    runs-on: ubuntu-latest
    # about 7500 mutants of 30 s each: night n runs those whose index is n
    # mod 14, so every mutant runs once in two weeks, split over six jobs of
    # about 90
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants
      - id: night
        run: echo "n=${NIGHT:-$(( $(date -u +%s) / 86400 % 14 ))}" >> "$GITHUB_OUTPUT"
        env:
          NIGHT: ${{ inputs.night }}
      # one job at a time: a mutant that breaks a limit runs the inputs in
      # allocation.rs, which the test allocator stops at 256 MB. A mutant that
      # makes the tests run past the timeout counts as caught. A mutant that
      # allocates without end (the expression parser never reaching the end
      # of its text) took the whole runner down, so every process gets 8 GB
      # of address space: past it the allocation fails and the mutant counts
      # as caught.
      - run: |
          ulimit -v 8388608
          status=0
          cargo mutants -p mmana-core -j 1 --timeout 120 --sharding round-robin \
            --shard $(( ${{ matrix.job }} * 14 + ${{ steps.night.outputs.n }} ))/84 || status=$?
          if [ -s mutants.out/missed.txt ]; then exit 2; fi
          [ "$status" -eq 0 ] || [ "$status" -eq 3 ]
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mutants.out-night${{ steps.night.outputs.n }}-${{ matrix.job }}
          path: mutants.out
