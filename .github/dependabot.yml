version: 2
updates:
  # also regenerates the entries in .github/workflows/actions.lock, except
  # that of a branch (rust-toolchain@master): gh actions-lock --relock
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # security updates only, one pull request for each ecosystem; the limit
  # stops the version updates. .github/workflows/audit.yml fails on the rest.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
